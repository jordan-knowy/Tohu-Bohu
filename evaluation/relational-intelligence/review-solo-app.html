<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tohu · Revue solo</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#211a2d;background:#f6f3fa}body{margin:0}main{max-width:820px;margin:auto;padding:24px}.top,.card{background:white;border:1px solid #ddd5e8;border-radius:14px;padding:20px;margin-bottom:16px}.top{position:sticky;top:0;z-index:2}.progress{height:8px;background:#eee8f4;border-radius:9px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:#7050a0}.muted{color:#6c6278;font-size:14px}h2{margin:0 0 4px}.who{font-size:14px;color:#4a3f5c;margin:2px 0 14px}.event{border-left:3px solid #9477b8;padding:12px 14px;margin:0 0 12px;background:#faf8fc;white-space:pre-wrap;border-radius:0 8px 8px 0;line-height:1.5}.hint{font-size:12.5px;color:#8b81a0;margin:-6px 0 16px}h3{font-size:15px;margin:20px 0 6px}label{display:block;margin:14px 0 8px;font-weight:650}textarea{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cfc5dc;border-radius:8px;font:inherit;min-height:90px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:12px;border:1px solid #e0d8e9;border-radius:10px;padding:12px 14px;cursor:pointer}.choice:has(input:checked){border-color:#7050a0;background:#f4f0fa}.choice input{width:auto;margin-top:3px}.choice b{display:block}.choice span{color:#6c6278;font-size:13px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#65458b;color:white}.secondary{background:#ece5f4}@media(max-width:650px){main{padding:10px}.top{position:static}}
</style></head><body><main><section class="top"><b id="title">Chargement…</b><div class="progress"><i id="bar"></i></div></section><section class="card" id="case"></section></main><script>
let cfg,index=0,state={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const current=()=>cfg.cases[index];
const CHOICES=[
  ['A','Ça se passe bien','La relation ou l\'échange semble positif, sain, sans problème visible.'],
  ['B','C\'est normal / neutre','Rien de particulier à signaler, ni positif ni négatif.'],
  ['C','Il y a un problème','Vous voyez une tension, une frustration, un retard ou un point d\'attention.'],
  ['D','Je ne sais pas','Pas assez d\'éléments dans cet extrait pour se prononcer.'],
];
function aliaser(c){const source=JSON.stringify(c),map={},counts={};for(const token of source.match(/(?:external|internal|participant|account)_[0-9a-f]{12}/g)??[]){if(map[token])continue;const kind=token.split('_')[0];counts[kind]=(counts[kind]??0)+1;const label=kind==='account'?'Entreprise':kind==='internal'?'Vous / votre équipe':kind==='external'?'Le contact':'Participant';map[token]=`${label}${counts[kind]>1?' '+String.fromCharCode(64+counts[kind]):''}`}return value=>{let out=String(value??'');for(const [token,label] of Object.entries(map))out=out.replaceAll(token,label);return out}}
function who(c,human){const names=[...new Set(c.participants.map(p=>human(p.id)))];return names.join(' · ')}
function isTranscript(e){return e.type==='transcript_window'||/transcript/i.test(e.type??'')}
function context(c){const human=aliaser(c);return `<h2>Un échange à lire</h2><p class="who">Entre : ${esc(who(c,human))}</p>${c.events.map(e=>{const raw=e.text??Object.entries(e).filter(([k])=>!['type','at'].includes(k)).map(([k,v])=>`${k}=${v}`).join(' · ');return `<div class="event">${esc(human(raw))}</div>${isTranscript(e)?"<p class=\"hint\">Extrait d'une transcription de réunion : les numéros ou tirets en début de ligne sont les tours de parole tels qu'enregistrés, ils ne correspondent pas forcément à l'ordre ci-dessus.</p>":''}`}).join('')}${c.context_facts.length?`<h3>Ce qu'on sait par ailleurs</h3><p class="who">${esc(human(c.context_facts.join(' · ')))}</p>`:''}`}
function form(c,a={}){return `${context(c)}<label>Après lecture, comment décririez-vous cet échange ?</label><div class="choices">${CHOICES.map(([v,t,d])=>`<label class="choice"><input type="radio" name="choice" value="${v}" ${a.choice===v?'checked':''}><span><b>${v}. ${esc(t)}</b><span>${esc(d)}</span></span></label>`).join('')}</div><label>Une précision à ajouter ? (optionnel)</label><textarea id="note" placeholder="Ce que vous remarquez, un désaccord avec ce que le système en conclut ailleurs, etc.">${esc(a.note)}</textarea>`}
function answer(){const choice=document.querySelector('input[name="choice"]:checked')?.value??null;return {choice,note:document.querySelector('#note').value.trim()}}
async function save(){const c=current(),a=answer();if(!a.choice)return;const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id:c.id,answer:a})});if(!r.ok)throw new Error((await r.json()).error);state[c.id]=a}
function finish(){const total=cfg.cases.length,answered=cfg.cases.filter(c=>state[c.id]?.choice),counts={A:0,B:0,C:0,D:0};answered.forEach(c=>counts[state[c.id].choice]++);const missing=cfg.cases.findIndex(c=>!state[c.id]?.choice);document.querySelector('#title').textContent='Revue terminée';document.querySelector('#bar').style.width='100%';document.querySelector('#case').innerHTML=`<h2>${missing===-1?'Merci, tout est enregistré ✓':'Presque fini'}</h2><p>${answered.length} cas sur ${total} ont une réponse.</p><p class="who">A · Ça se passe bien : ${counts.A}<br>B · C'est normal : ${counts.B}<br>C · Il y a un problème : ${counts.C}<br>D · Je ne sais pas : ${counts.D}</p>${missing===-1?'<p class="muted">Tes réponses sont sauvegardées dans le dossier private/. Tu peux fermer cet onglet.</p>':`<p class="muted">Il reste ${total-answered.length} cas sans réponse (un clic A/B/C/D est nécessaire pour qu'un cas soit enregistré).</p><div class="actions"><button class="primary" id="goto">Aller au premier cas sans réponse</button></div>`}<div class="actions"><button class="secondary" id="back">← Revenir aux cas</button></div>`;document.querySelector('#back').onclick=()=>{index=cfg.cases.length-1;render()};const g=document.querySelector('#goto');if(g)g.onclick=()=>{index=missing;render()}}
function render(){const c=current(),a=state[c.id]??{},last=index===cfg.cases.length-1;document.querySelector('#title').textContent=`Cas ${index+1} sur ${cfg.cases.length}`;document.querySelector('#bar').style.width=`${100*(index+1)/cfg.cases.length}%`;document.querySelector('#case').innerHTML=form(c,a)+`<div class="actions"><button class="secondary" id="prev">← Précédent</button><button class="primary" id="next">${last?'Terminer ✓':'Suivant →'}</button></div>`;document.querySelector('#prev').onclick=async()=>{await save();index=Math.max(0,index-1);render()};document.querySelector('#next').onclick=async()=>{await save();if(last)return finish();index=index+1;render()}}
fetch('/api/config').then(r=>r.json()).then(x=>{cfg=x;state=x.state;index=Math.max(0,cfg.cases.findIndex(c=>!state[c.id]?.choice));render()}).catch(e=>document.querySelector('#case').textContent=e.message);
</script></body></html>
