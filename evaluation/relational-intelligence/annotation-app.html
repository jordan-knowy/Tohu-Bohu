<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tohu · Annotation Gold V6</title><style>
:root{font-family:Inter,system-ui,sans-serif;color:#211a2d;background:#f6f3fa}body{margin:0}main{max-width:1020px;margin:auto;padding:24px}.top,.card{background:white;border:1px solid #ddd5e8;border-radius:14px;padding:20px;margin-bottom:16px}.top{position:sticky;top:0;z-index:2}.progress{height:8px;background:#eee8f4;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#7050a0}.muted{color:#6c6278}.event{border-left:3px solid #9477b8;padding:10px 14px;margin:10px 0;background:#faf8fc;white-space:pre-wrap}.focus{border-color:#3d7c68;background:#f2faf7}.facts{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#eee8f4;border-radius:20px;padding:4px 9px;font-size:12px}label{display:block;margin:14px 0 5px;font-weight:650}textarea,input,select{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cfc5dc;border-radius:8px;font:inherit}textarea{min-height:82px}.markers{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:7px}.marker{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:7px;border:1px solid #e0d8e9;border-radius:8px;padding:8px;font-size:13px}.marker input{width:auto}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:18px}button{border:0;border-radius:8px;padding:10px 15px;font-weight:700;cursor:pointer}.primary{background:#65458b;color:white}.secondary{background:#ece5f4}.warn{color:#8b3b3b}.choices{display:flex;gap:12px;flex-wrap:wrap}.choices label{font-weight:500}.choices input{width:auto}.diff{padding:12px;border:1px solid #dfd4eb;border-radius:8px;margin:12px 0}.hidden{display:none}@media(max-width:650px){main{padding:10px}.top{position:static}}
</style></head><body><main><section class="top"><b id="title">Chargement…</b><p class="muted" id="subtitle"></p><div class="progress"><i id="bar"></i></div></section><section class="card" id="case"></section></main><script>
const fields=['expected_facts','expected_markers','forbidden_markers','expected_commitments','expected_roles','indeterminable_fields'];let cfg,index=0,state={};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const lines=s=>String(s??'').split('\n').map(x=>x.trim()).filter(Boolean);const current=()=>cfg.cases[index];const idOf=c=>c.case?.id??c.id;
function context(c){c=c.case??c;return `<h2>${esc(c.id)}</h2><div class="facts"><span class="pill">${esc(c.case_type)}</span><span class="pill">${esc(c.channel)}</span><span class="pill">source ${esc(c.source_completeness)}</span></div><h3>Participants</h3><p>${c.participants.map(p=>`${esc(p.id)} · ${esc(p.side)} · ${esc(p.role)}`).join('<br>')||'Non déterminés'}</p><h3>Timeline</h3>${c.events.map(e=>`<div class="event ${e.type==='focus'?'focus':''}"><b>${esc(e.type)} · ${esc(e.at)}</b><br>${esc(e.text??Object.entries(e).filter(([k])=>!['type','at'].includes(k)).map(([k,v])=>`${k}=${v}`).join(' · '))}</div>`).join('')}<h3>Faits de contexte</h3><p>${c.context_facts.map(esc).join('<br>')||'Aucun'}</p><p class="muted">${esc(c.context_before)}<br>${esc(c.context_after)}</p>`}
function privacyForm(c,a={}){const editable=a.events??c.events;return `${context(c)}${c.privacy_findings.length?`<p class="warn">À vérifier : ${c.privacy_findings.map(esc).join(', ')}</p>`:'<p>Aucun email, téléphone ou URL résiduel détecté.</p>'}<label>Textes pseudonymisés — remplacer tout nom résiduel inutile, sans retirer rôle, cible ni hiérarchie</label>${editable.map((e,i)=>e.text!==undefined?`<textarea data-private-event="${i}">${esc(e.text)}</textarea>`:'').join('')}<label><input id="reviewed" type="checkbox" style="width:auto" ${a.privacy_reviewed?'checked':''}> J’ai vérifié que les identités inutiles sont pseudonymisées et que la structure relationnelle utile est préservée.</label><label>Annotation possible ?</label><select id="possible"><option value="yes" ${a.annotation_possible!==false?'selected':''}>Oui</option><option value="no" ${a.annotation_possible===false?'selected':''}>Non</option></select><label>Complétude</label><select id="complete"><option ${a.source_completeness==='complete'?'selected':''}>complete</option><option ${a.source_completeness!=='complete'&&a.source_completeness!=='insufficient'?'selected':''}>partial</option><option ${a.source_completeness==='insufficient'?'selected':''}>insufficient</option></select><label>Motif si annotation impossible</label><textarea id="reason">${esc(a.annotation_not_possible_reason)}</textarea>`}
function markerGrid(a){return `<div class="markers">${Object.entries(cfg.markerDefinitions).map(([id,d])=>`<div class="marker"><input type="checkbox" data-present="${id}" ${a.labels?.expected_markers?.includes(id)?'checked':''}><span><b>${id}</b> ${esc(d)}</span><label style="margin:0"><input type="checkbox" data-forbidden="${id}" ${a.labels?.forbidden_markers?.includes(id)?'checked':''}> faux</label></div>`).join('')}</div>`}
function annotationForm(c,a={}){return `${context(c)}<label>1. Faits explicitement observables — un par ligne</label><textarea id="facts">${esc(a.labels?.expected_facts?.join('\n'))}</textarea><label>2–3. Phénomènes présents ; cocher « faux » seulement si ce serait clairement une confusion</label>${markerGrid(a)}<label>4. Engagements — un par ligne : qui | envers qui | quoi | échéance | condition | statut | volontarité</label><textarea id="commitments">${esc(a.labels?.expected_commitments?.join('\n'))}</textarea><label>5. Rôles — un par ligne : rôle | déclaré/inféré | preuve | certitude</label><textarea id="roles">${esc(a.labels?.expected_roles?.join('\n'))}</textarea><label>6. Direction relationnelle</label><select id="direction">${[['up','↑ amélioration'],['stable','→ stable'],['down','↓ dégradation'],['indeterminable','? indéterminable']].map(([v,l])=>`<option value="${v}" ${a.labels?.expected_direction===v?'selected':''}>${l}</option>`).join('')}</select><label>7. Ce qu’on ne peut pas déterminer — un point par ligne</label><textarea id="unknown">${esc(a.labels?.indeterminable_fields?.join('\n'))}</textarea><label>Notes de preuve pour l’arbitre</label><textarea id="notes">${esc(a.evidence_notes)}</textarea><label><input id="done" type="checkbox" style="width:auto" ${a.complete?'checked':''}> Annotation terminée</label>`}
function arbitrationForm(item,a={}){let labels={};for(const d of item.differences)labels[d.field]=a.labels?.[d.field]??d.A;return `${context(item)}<h3>Divergences uniquement</h3>${item.differences.map(d=>`<div class="diff"><b>${esc(d.field)}</b><div class="choices"><label><input type="radio" name="pick-${d.field}" value="A" ${JSON.stringify(labels[d.field])===JSON.stringify(d.A)?'checked':''}> A : ${esc(JSON.stringify(d.A))}</label><label><input type="radio" name="pick-${d.field}" value="B" ${JSON.stringify(labels[d.field])===JSON.stringify(d.B)?'checked':''}> B : ${esc(JSON.stringify(d.B))}</label><label><input type="radio" name="pick-${d.field}" value="custom"> Autre</label></div><textarea data-custom="${d.field}" placeholder="Valeur personnalisée, une entrée par ligne"></textarea></div>`).join('')}<p class="muted">Notes A : ${esc(item.A_notes)}<br>Notes B : ${esc(item.B_notes)}</p><label><input id="done" type="checkbox" style="width:auto" ${a.complete?'checked':''}> Arbitrage terminé</label>`}
function answer(){const c=current(),id=idOf(c);if(cfg.role==='privacy'){const events=(state[id]?.events??c.events).map(x=>({...x}));for(const el of document.querySelectorAll('[data-private-event]'))events[Number(el.dataset.privateEvent)].text=el.value;return {privacy_reviewed:document.querySelector('#reviewed').checked,privacy_findings:[],events,annotation_possible:document.querySelector('#possible').value==='yes',annotation_not_possible_reason:document.querySelector('#reason').value.trim()||null,source_completeness:document.querySelector('#complete').value};}if(cfg.role==='arbitration'){const base={...(state[id]?.labels??{})};for(const d of c.differences){const pick=document.querySelector(`input[name="pick-${d.field}"]:checked`)?.value??'A';base[d.field]=pick==='A'?d.A:pick==='B'?d.B:(d.field==='expected_direction'?document.querySelector(`[data-custom="${d.field}"]`).value.trim():lines(document.querySelector(`[data-custom="${d.field}"]`).value))}return {labels:base,complete:document.querySelector('#done').checked};}const present=[...document.querySelectorAll('[data-present]:checked')].map(x=>x.dataset.present),forbidden=[...document.querySelectorAll('[data-forbidden]:checked')].map(x=>x.dataset.forbidden).filter(x=>!present.includes(x));return {complete:document.querySelector('#done').checked,evidence_notes:document.querySelector('#notes').value,labels:{expected_facts:lines(document.querySelector('#facts').value),expected_markers:present,forbidden_markers:forbidden,expected_commitments:lines(document.querySelector('#commitments').value),expected_roles:lines(document.querySelector('#roles').value),expected_direction:document.querySelector('#direction').value,indeterminable_fields:lines(document.querySelector('#unknown').value)}}}
async function save(){const c=current(),case_id=idOf(c),a=answer();const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({case_id,answer:a})});if(!r.ok)throw new Error((await r.json()).error);state[case_id]=a}
function render(){const c=current(),id=idOf(c),a=state[id]??{};document.querySelector('#title').textContent=`${cfg.role} · ${cfg.annotator} · cas ${index+1}/${cfg.cases.length}`;document.querySelector('#subtitle').textContent='Aucun score, résultat Legacy, prédiction IA ou recommandation n’est présenté.';document.querySelector('#bar').style.width=`${100*(index+1)/cfg.cases.length}%`;document.querySelector('#case').innerHTML=(cfg.role==='privacy'?privacyForm(c,a):cfg.role==='arbitration'?arbitrationForm(c,a):annotationForm(c,a))+`<div class="actions"><button class="secondary" id="prev">Précédent</button><button class="primary" id="next">Enregistrer et suivant</button></div>`;document.querySelector('#prev').onclick=async()=>{await save();index=Math.max(0,index-1);render()};document.querySelector('#next').onclick=async()=>{await save();index=Math.min(cfg.cases.length-1,index+1);render()}}
fetch('/api/config').then(r=>r.json()).then(x=>{cfg=x;state=x.state;render()}).catch(e=>document.querySelector('#case').textContent=e.message);
</script></body></html>
