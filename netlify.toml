# Déploiement Netlify — app Vite multi-pages avec slugs publics propres.
# Les fichiers HTML restent uniquement des entrées de build internes.

[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/pages/index.html"
  status = 200

# Compat anciennes URLs littérales (bookmarks, liens externes, indexation
# antérieure aux slugs propres ci-dessous) — les fichiers ont été déplacés
# dans pages/, ces chemins ne sont plus servis tels quels par défaut.
[[redirects]]
  from = "/index.html"
  to = "/pages/index.html"
  status = 200

[[redirects]]
  from = "/login.html"
  to = "/pages/login.html"
  status = 200

[[redirects]]
  from = "/onboarding.html"
  to = "/pages/onboarding.html"
  status = 200

[[redirects]]
  from = "/confidentialite.html"
  to = "/pages/confidentialite.html"
  status = 200

[[redirects]]
  from = "/cgu.html"
  to = "/pages/cgu.html"
  status = 200

[[redirects]]
  from = "/connexion"
  to = "/pages/login.html"
  status = 200

[[redirects]]
  from = "/bienvenue"
  to = "/pages/onboarding.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/pages/confidentialite.html"
  status = 200

[[redirects]]
  from = "/cgu"
  to = "/pages/cgu.html"
  status = 200

[[redirects]]
  from = "/app"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/super-admin"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/super-admin/*"
  to = "/app.html"
  status = 200

[[redirects]]
  from = "/preferences"
  to = "/app.html"
  status = 200
